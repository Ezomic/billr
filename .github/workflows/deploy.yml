name: Deploy to production

# Manual deploys only. Production is deployed by hand over SSH; this workflow
# is kept as a workflow_dispatch escape hatch and never triggers automatically.
on:
  workflow_dispatch:
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /home/deploy/billr
            php artisan down --retry=15
            git fetch origin
            git reset --hard origin/main
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan optimize:clear
            npm ci
            npm run build
            php artisan migrate --force
            php artisan optimize
            sudo /bin/systemctl reload php8.4-fpm
            php artisan up
