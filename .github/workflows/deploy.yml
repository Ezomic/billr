name: Deploy to production

# Manual deploys only. Production is deployed by hand over SSH; this workflow
# is kept as a workflow_dispatch escape hatch and never triggers automatically.
on:
  workflow_dispatch:
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /home/deploy/billr
            php artisan down --retry=15
            git fetch origin
            git reset --hard origin/main
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan optimize:clear
            npm ci
            npm run build
            php artisan migrate --force
            # Deliberately not `optimize`: that includes view:cache, which compiles
            # every Blade view as the deploy user. Laravel stamps a compiled view's
            # mtime with touch(), and touch() with an explicit time needs ownership,
            # not just write access, so www-data hits EPERM the first time it has to
            # recompile one and every request 500s. Leaving views uncompiled lets
            # www-data compile and own them at runtime.
            php artisan config:cache
            php artisan route:cache
            php artisan event:cache
            # No `systemctl reload php8.4-fpm` here on purpose. All 21 sites on the
            # droplet share one php-fpm master and therefore one opcache, so a reload
            # to deploy this app would discard ~350MB of cached bytecode belonging to
            # every other app and force them all to recompile. opcache.validate_timestamps
            # is on, so the new code is picked up on the next request without it.
            # See INFRA-28. If that setting is ever turned off, this must come back.
            php artisan up
